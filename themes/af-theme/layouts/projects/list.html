{{ define "main" }}
<main class="container">
  <a href="{{ "/" | relURL }}" class="back-link">← cd ..</a>

  <header class="cat-header">
    <div class="cat-title-row">
      <h1>Proyectos</h1>
    </div>
  </header>

  {{ range .Pages }}
  <div class="project-card">
    <div class="project-header">
      <h3>{{ .Title }}</h3>
      {{ with .Params.status }}<span class="project-status">{{ . }}</span>{{ end }}
    </div>
    <div class="article-body">{{ .Content }}</div>
    <div class="project-tags" style="margin-top:12px">
      {{ range .Params.tags }}<span class="project-tag">#{{ . }}</span>{{ end }}
    </div>
  </div>
  {{ end }}
</main>
{{ end }}
