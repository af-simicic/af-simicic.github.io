{{ $cat := index .Params.categories 0 | default "" }}
{{ $catSlug := $cat | urlize }}
<a href="{{ .Permalink }}" class="post-card">
  <div class="post-meta">
    <span class="cat-pill cat-{{ $catSlug }}">{{ $cat }}</span>
    <span class="post-date">{{ .Date.Format "2 de January de 2006" }} · {{ .ReadingTime }} min de lectura</span>
  </div>
  <h3 class="post-title">{{ .Title }}</h3>
  {{ with .Params.summary }}<p class="post-summary">{{ . }}</p>{{ end }}
</a>
