<header class="site-header">
  <div class="header-inner">

    <a href="{{ "/" | relURL }}" class="site-logo" aria-label="{{ .Site.Title }}">
      <div class="logo-icon" aria-hidden="true">&gt;_</div>
      <span class="logo-text">Andrés <span>Fuentes</span></span>
    </a>

    <nav class="site-nav" aria-label="Navegación principal">
      <a href="{{ "/linux/" | relURL }}" {{ if eq .Section "linux" }}class="active" aria-current="page"{{ end }}>Linux</a>
      <a href="{{ "/seguridad/" | relURL }}" {{ if eq .Section "seguridad" }}class="active" aria-current="page"{{ end }}>Seguridad</a>
      <a href="{{ "/data/" | relURL }}" {{ if eq .Section "data" }}class="active" aria-current="page"{{ end }}>Data</a>
      <a href="{{ "/ia/" | relURL }}" {{ if eq .Section "ia" }}class="active" aria-current="page"{{ end }}>IA</a>
    </nav>

    {{- with .Site.Params.avatarImage }}
    <div class="header-avatar" aria-hidden="true">
      <img src="{{ . | relURL }}" alt="Avatar de {{ $.Site.Params.author }}" loading="lazy">
    </div>
    {{- else }}
    <div class="header-avatar" aria-hidden="true">
      <span class="avatar-initial">
        {{ with .Site.Params.author }}{{ substr . 0 1 }}{{ end }}
      </span>
    </div>
    {{- end }}

    <button class="mobile-toggle" id="mobile-toggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="mobile-nav">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <line x1="2" y1="4"  x2="14" y2="4"  stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="2" y1="8"  x2="14" y2="8"  stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="2" y1="12" x2="14" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>

  </div>
</header>
