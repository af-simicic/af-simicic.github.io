baseURL = "https://af-simicic.github.io/"
languageCode = "es"
title = "AI Security & Data"

# Renderizado Markdown
[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

  [markup.highlight]
    style = "onedark"
    lineNos = false
    tabWidth = 2

  [markup.goldmark.renderer]
    unsafe = true

# Parámetros del sitio
[params]
  author = "Andrés Fuentes"
  bio = "Analista de datos en formación con foco en sistemas Linux, ciberseguridad defensiva e inteligencia artificial aplicada. Trabajo con Debian, Ubuntu y Kali Linux, y desarrollo análisis de datos en Python y R. Interesado en automatización de sistemas, observabilidad y análisis de logs. Enfoque práctico basado en laboratorio y resolución de problemas reales."
  github = "af-simicic"
  description = "Blog técnico sobre Linux, ciberseguridad, análisis de datos e inteligencia artificial."
  avatarImage = "images/avatar.jpg"

# Menú principal (fuente única de verdad)
[menu]

  [[menu.main]]
    name = "Linux"
    url = "/linux/"
    weight = 1

  [[menu.main]]
    name = "Seguridad"
    url = "/seguridad/"
    weight = 2

  [[menu.main]]
    name = "Data Science"
    url = "/data/"
    weight = 3

  [[menu.main]]
    name = "IA"
    url = "/ia/"
    weight = 4

[outputs]
  home = ["HTML", "JSON"]
  section = ["HTML"]
  page = ["HTML"]
